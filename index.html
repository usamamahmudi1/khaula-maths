+92 332 88 99 202\";\n    const digits = phone.replace(/\\D/g, \"\");\n    return {\n      phone,\n      waLink: \"https://wa.me/\" + digits + \"?text=\" + encodeURIComponent(\"Hi Khaula, I'd like to ask about online maths lessons.\"),\n      mailLink: \"mailto:Khaula.ky@gmail.com?subject=\" + encodeURIComponent(\"Online maths lessons enquiry\"),\n      boards: [\"Cambridge O Level\", \"IGCSE\", \"Edexcel\", \"GCSE\", \"AS & A Level\", \"IB MYP\", \"US middle & high school math\"],\n      offers: [\n        { tag: \"Most popular\", title: \"One-to-one lessons\", body: \"A plan built around one student: their board, their gaps, their pace. Shared whiteboard, worked solutions, recording on request.\" },\n        { tag: \"2\u20134 students\", title: \"Small group classes\", body: \"Same year group and board, taught together. Lower cost per student, with enough attention that nobody hides at the back.\" },\n        { tag: \"Exam season\", title: \"Crash courses\", body: \"Focused revision in the weeks before papers: topic sweeps, timed practice and the mark-scheme habits examiners reward.\" },\n        { tag: \"As needed\", title: \"Homework & past papers\", body: \"Send a question or a marked paper. Get it worked through properly, with the reasoning laid out step by step.\" }\n      ],\n      steps: [\n        { n: \"01\", title: \"Message on WhatsApp\", body: \"Tell her the year group, board and what's going wrong. No forms.\" },\n        { n: \"02\", title: \"Free trial lesson\", body: \"A real lesson, not a sales call. It doubles as a diagnostic of where the gaps are.\" },\n        { n: \"03\", title: \"A plan and a schedule\", body: \"Topics in order, sessions at a time that works in your timezone.\" },\n        { n: \"04\", title: \"Progress you can see\", body: \"Regular feedback to parents, with records of what's been covered and what's next.\" }\n      ],\n      strengths: [\"Activity-based instruction\", \"AI-enhanced, data-driven teaching\", \"Google & Microsoft certified\", \"Adapts to every learning style\", \"Strong parent communication\"],\n      roles: [\n        { years: \"2024 \u2013 2026\", school: \"The City School \u2014 Mathematics, O Level\", detail: \"Delivering O Level lessons through active learning, with schemes of work aligned to curriculum standards and regular assessment of student progress.\" },\n        { years: \"2022 \u2013 2024\", school: \"Beaconhouse School System \u2014 Mathematics, O Level\", detail: \"Planning and delivering instruction with clear learning objectives, varied materials and continuous evaluation and feedback.\" },\n        { years: \"2020 \u2013 2022\", school: \"Pak-Turk Maarif School \u2014 Mathematics, O Level\", detail: \"Taught O Level mathematics and organised the Math Kangaroo and ICATS competitions to build student motivation.\" },\n        { years: \"2018 \u2013 2020\", school: \"IIUI School \u2014 Mathematics, O Level & HSSC\", detail: \"Taught mathematics from grade 8 through intermediate level, keeping detailed records of progress and working closely with parents.\" },\n        { years: \"2013 \u2013 2018\", school: \"The Lyceum School System \u2014 Mathematics\", detail: \"Taught grades 6 to 10, preparing schemes of work and sharing teaching practice across the department.\" }\n      ],\n      quals: [\n        \"Cambridge O Level / IGCSE Mathematics Examiner\",\n        \"M.Sc. Mathematics \u2014 University of Peshawar, 2007\",\n        \"B.Sc. Double Mathematics & Computer Science \u2014 Jinnah College for Women, 2004\",\n        \"Professional Development Course, CAIE \u00b7 PGCC\",\n        \"Artificial Intelligence certified by Google and Microsoft\"\n      ],\n      extras: [\n        \"Advanced study in real & complex analysis, topology, measure theory and numerical analysis\",\n        \"Mathematical statistics and numerical methods for A Level and beyond\",\n        \"Comfortable with digital tools: MS 365, programming, web development\",\n        \"Organiser of school mathematics competitions (Math Kangaroo, ICATS)\",\n        \"Teaches in English; Urdu, Hindi and Pashto also spoken\"\n      ]\n    };\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"
